<ion-header align-title=”center”>
  <ion-navbar align-title=”center”>
    <ion-title align-title=”center”><img alt="logo" height="55" cache="true" src="assets/imgs/header.svg" ></ion-title>
  </ion-navbar>
</ion-header>

<ion-content text-justify>
	<ion-card *ngFor="let bank of bandetails; let i = index">
<!-- 		<ion-card-header text-center>
			{{bank.header}}
		</ion-card-header> -->
		<img [src]="bank.logo"/>
		<ion-card-content class="contact-us">
			<div text-justify>
				 <ion-grid class="bank-details">
					<ion-row  *ngFor="let detail of bank.details; let in = index" class="light-border-btm">
				<ion-col col-5><strong>{{detail.field}}</strong></ion-col>
				<ion-col col-1 style="font-weight:bold;">:</ion-col>
						<ion-col col-6 style="text-align:left !important">{{detail.value}}</ion-col>
					</ion-row>
				 </ion-grid>
			</div>
		</ion-card-content>
	</ion-card>
</ion-content>
