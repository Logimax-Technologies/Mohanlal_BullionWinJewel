  Ionic pages and navigation.

<ion-header>
    <ion-navbar>
        <button ion-button menuToggle>
            <ion-icon name="menu"></ion-icon>
        </button>
        <ion-title>Custom Order</ion-title>
    </ion-navbar>
   <!--  <ion-searchbar [(ngModel)]="mySearch" (input)="searchCollection()" placeholder="Search Collection" [showCancelButton]="shouldShowCancel">
    </ion-searchbar> -->
</ion-header>

<ion-content no-margin-bottom> <ion-card no-margin-bottom> <ion-card-header style="font-weight: bold !important;">
Enter Order Details </ion-card-header><form #form="ngForm">
<ion-row no-padding> 
	<ion-col>
		<ion-item>
			<ion-label>Reference no</ion-label><ion-input name="ReferenceNo" [(ngModel)]="productdet.customer_ref_no" placeholder=""></ion-input> 
		</ion-item> 
	</ion-col> 
</ion-row> 
<ion-row no-padding> 
	<ion-col>
		<ion-item>
			<ion-label>Name</ion-label> <ion-input name="ProductName" [(ngModel)]="productdet.name" placeholder="Enter Item Name"></ion-input> 
		</ion-item> 
	</ion-col> 
</ion-row> 
<ion-row no-padding> <ion-col> <ion-item>
<ion-label>Qty</ion-label> <ion-input name="ProductQty" [(ngModel)]="productdet.qty"
	type="number"></ion-input> </ion-item> </ion-col> </ion-row> 
	
	<ion-row no-padding>
		<ion-col>
			<ion-item> 
				<ion-label>Qty Type</ion-label> 
				<ion-select name="Qty Type" [(ngModel)]="productdet.qty_type">
					 <ion-option value="1" > Pieces	</ion-option>
					 <ion-option value="2" > Sets	</ion-option>
					 <ion-option value="3" > Pairs	</ion-option>
				</ion-select>
			 </ion-item>
		 </ion-col>
		 </ion-row>

	<ion-row no-padding> <ion-col>
<ion-item> <ion-label>Purity</ion-label> <ion-select name="ProductPurity" 
	[(ngModel)]="productdet.id_purity"> <ion-option
	*ngFor="let pur of productdet.purities" value="{{pur.id_purity}}" >{{pur.purity}}</ion-option> <!-- [selected]="true" [disabled]="none" -->
</ion-select> </ion-item> </ion-col> </ion-row>

 <ion-row no-padding> <ion-col> <ion-item>
<ion-label>Size/Length</ion-label> <ion-input name="ProductSize"
	[(ngModel)]="productdet.sizeorlen" type="text" ></ion-input>
</ion-item> </ion-col> </ion-row>

 <ion-row
	no-padding > <ion-col>
<ion-item> <ion-label>Weight(grms)</ion-label> <ion-input name="ProductWeight"
	[(ngModel)]="productdet.reqweight" type="number"></ion-input>
</ion-item> </ion-col> </ion-row> 



<ion-row no-padding> 
		<ion-col>
			<!-- <ion-item>
				<ion-label>Date</ion-label><ion-input name="deliverydate"  displayFormat="MMM DD YYY" type="date" [(ngModel)]="productdet.due_date"></ion-input> 
			</ion-item>  -->
			<ion-item>
				<ion-label>Date</ion-label>
			
				<ion-input  readonly="true" class="ion_datetime" name="deliverydate" [(ngModel)]="productdet.due_date" placeholder="Select Date" displayFormat="DD-MM-YYYY" (focusin)="show()"></ion-input>

			</ion-item> 
		</ion-col> 
	</ion-row> 

<ion-row no-padding>
	 <ion-col>
		 <ion-item>
			<ion-label>Remarks</ion-label>
			 <ion-textarea name="Productremarks" [(ngModel)]="productdet.remarks" placeholder="Enter your remarks"></ion-textarea>
		</ion-item>
	 </ion-col>
</ion-row>

<ion-grid>
	 <ion-row>
		 <ion-col col-6	*ngFor="let targetPath of targetPaths; let id = index">
			<ion-card class="block"> <ion-icon name="trash" class="deleteIcon" (click)="deletePhoto(id)"></ion-icon>
				 <img [src]="targetPath" *ngIf="targetPath" imageViewer="{{targetPath}}"/>
			</ion-card>
		 </ion-col>
	</ion-row>
 </ion-grid>
 
 <ion-row *ngIf="targetPath?.length <= 10">

	<ion-col> <!-- <h3 [hidden]="lastImage !== null">Select Image !</h3> -->
		<ion-buttons *ngIf="productdet.is_customeitem">
			<button ion-button icon-left (click)="presentActionSheet()">
				<ion-icon name="camera"></ion-icon>
					Select Image
			</button>
		</ion-buttons>
	</ion-col>
 </ion-row>
 </form>
</ion-card>
</ion-content>

<ion-footer style="    margin-bottom: 75px;background: white !important;" no-lines> <ion-toolbar
	style="padding: 0px;min-height: 0px;"> <ion-grid
	style="padding: 0px;"> <ion-row style="padding: 0px;">
<ion-col style="padding: 0px;" style="text-align: center;">
<button [disabled]="!form.valid" class="footer-b1" ion-button 
	(click)="addtocart(productdet)">
	<ion-icon style="padding-right:7px" name="cart"></ion-icon>
	Place Order
</button>
</ion-col>  </ion-row> </ion-grid> </ion-toolbar> </ion-footer>
