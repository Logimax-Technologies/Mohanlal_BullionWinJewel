  Ionic pages and navigation.

<ion-header> <ion-navbar>
<button ion-button menuToggle>
	<ion-icon name="menu"></ion-icon>
</button>
<ion-title>My Dashboard</ion-title> </ion-navbar> </ion-header>


<ion-content>

	<ion-row align="center">
		<ion-col>
			<span style="text-align: center !important;color: black !important;font-size: 20px !important;font-weight: 700 !important;">{{dispname}}</span>
		</ion-col>
	</ion-row>
<div *ngIf="branchname"  class="branchtitle">{{branchname}}</div>
<!-- take data from order-detail component. --> <order-detail></order-detail>
<span *ngIf="productItems?.length > 0">
	<ion-list-header style="background: #eee;"> EXCLUSIVE DESIGNS FOR YOU </ion-list-header>
	<ion-row>
	  <ion-col col-6 [ngClass]="animateClass" *ngFor=" let item of productItems; let i=index " >
		<ion-card imageCache style="margin:0px;border: 1px solid #e4e4e4;height: 165px;">
		  <div style="margin: 3px;">
			<span *ngIf="item.is_stock_avail==1" class="instock">Instock</span>
			<span *ngIf="item.is_stock_avail==0"  class="outofstock">Out of stock</span>
			<span *ngIf="item.is_new == 1" style="float:right;"><ion-badge color="secondary">New</ion-badge></span>
		  </div>
		  <span *ngIf="!isquickselect" (click)="openProductdetails(item.id_product)">
			  <img style="height: 120px;width: auto;margin: 0 auto;" *ngIf='item.imgurl != null' src='{{item.imgurl}}' imageCache/>
			  <img style="height: 120px;width: auto;margin: 0 auto;" *ngIf='item.imgurl == null' src='assets/images/no-img.png' imageCache/>
		  </span>
		  <ion-item no-padding style="height: 120px;" *ngIf="isquickselect" >
			<ion-label>
			  <img style="height: 120px;width: auto;margin: 0 auto;" *ngIf='item.imgurl != null' src='{{item.imgurl}}' imageCache/>
			  <img style="height: 120px;width: auto;margin: 0 auto;" *ngIf='item.imgurl == null' src='assets/images/no-img.png' imageCache/>
			</ion-label>
			<ion-checkbox style="margin: 0px;" color="dark" (ionChange)="productschange($event, item)" ></ion-checkbox>
		  </ion-item>
		  <div class="">
			{{item.name}}
		  </div>
		</ion-card>
		<div style="box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);">
		  <ion-row class="card-detail" no-padding *ngIf="isquickselect">
			<ion-col no-padding class="col-6">N.Wgt : {{item.reqweight}} g</ion-col>
			<ion-col no-padding class="col-6"  *ngIf="item.sizeorlen != null">S/L : {{item.sizeorlen}}</ion-col>
		  </ion-row>
		  <ion-row class="card-detail" no-padding *ngIf="isquickselect">
			<ion-col no-padding class="col-6">Purity : <span *ngFor="let i of item.purities"><span *ngIf="i.id_purity == item.id_purity">{{i.purity}}</span></span></ion-col>
			<ion-col no-padding class="col-6" *ngIf="item.is_chain == 1">Hook : {{item.hook_type == 1 ? "S Hook" : "M Hook"}}</ion-col>
		  </ion-row>
		</div>
	  </ion-col>
	</ion-row>
	</span>
	<br/>
	<br/>
	<br/>
	<br/>
	<br/>
	<br/>
</ion-content>
<ion-footer *ngIf="productItems?.length > 0">
  <ion-toolbar color="primary">
    <ion-buttons end *ngIf="addcartbtn">
      <button ion-button ng-model="addcartbth" (click)="addtocart()">
        <ion-icon name="cart" ></ion-icon> Add
      </button>
    </ion-buttons>
    <ion-buttons  end>
      <button ion-button ng-model="isquickselect" (click)="quickselect()">
        <ion-icon name="md-checkmark-circle-outline" ></ion-icon> Quick
      </button>
    </ion-buttons>
</ion-toolbar>
</ion-footer>
