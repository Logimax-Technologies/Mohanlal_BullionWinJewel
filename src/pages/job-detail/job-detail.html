<ion-header style="background: #000">
	<ion-navbar>
			<button ion-button menuToggle>
					<ion-icon name="menu"></ion-icon>
			</button>
			<ion-title>Product Detail</ion-title>
	</ion-navbar>
</ion-header>
<ion-content [@flyInTopSlow]="0">
	<ion-card>
			<ion-card-header no-padding>
			<ion-row>
				<ion-col><button ion-button clear small style="color:black !important" icon-start>Product Name : {{productdet.productname}}</button></ion-col>
				<ion-col style="margin: auto;text-align: end;">{{productdet.orderno}}</ion-col>
			</ion-row>
		</ion-card-header>
		<hr>
		<img src="{{productdet.image}}" imageViewer="{{productdet.image}}"/>
				  <hr>
		  <ion-scroll scrollX="true" style="height:70px">
               <ion-row *ngIf='productdet.customimages !=null' nowrap>
                   <ion-col col-3 width-33 style="padding: 5px;" *ngFor=" let oimage of productdet.customimages; let i=index " (click)="changeImage(oimage)">
                       <ion-card style="margin: 0px 0px 0px 0px;box-shadow: none;min-width: 75px;">
                           <img src='{{oimage}}' width="60px" height="60px" />
                       </ion-card>
                   </ion-col>
							 </ion-row>
							 <ion-row *ngIf='productdet.customimages===null'>
									<ion-col  style="padding: 5px;" align="left">
											<ion-card style="margin: 0px 0px 0px 0px;box-shadow: none;min-width: 25px;">
													<img src='{{productdet.image}}' width="60px" height="60px" imageCache/>
											</ion-card>
									</ion-col>
							</ion-row>
           </ion-scroll>
           <hr>
		<ion-card-content>
			<p><b>Status</b> : {{productdet.orderstatus}}</p>
		 </ion-card-content>
		 <ion-row no-padding>
			<ion-col>
			  <button ion-button clear small style="color:black !important" icon-start>
				<ion-icon name='log-in'></ion-icon>
				{{productdet.order_date}}
			  </button>
			</ion-col>
			<ion-col text-center>
			  <button ion-button clear small style="color:black !important" icon-start>
				<ion-icon name='log-out'></ion-icon>
				{{productdet.delivery_date}}
			  </button>
			</ion-col>
		</ion-row>
		 <ion-row no-padding>
			<ion-col>
			  <button ion-button clear small style="color:black !important" icon-start>
				<ion-icon name='cart'></ion-icon>
				Qty : {{productdet.totalitems}}
			  </button>
			</ion-col>
			<ion-col text-center>
			  <button ion-button clear small style="color:black !important" icon-start>
				<ion-icon name='beaker'></ion-icon>
				Weight : {{productdet.weight}}
			  </button>
			</ion-col>
		   </ion-row>
			 <ion-row no-padding>
				<ion-col float-left>
					<button ion-button clear small  icon-start style="font-size:12px !important;color:black !important">
					  <!-- <ion-icon name='beaker'></ion-icon> -->
					  Size/Length : {{productdet.size}}
					</button>
				  </ion-col>
					<ion-col *ngIf='productdet.due_date !=null' float-right>
						<button ion-button clear small  icon-start style="font-size:12px !important;color:black !important">
						<!-- 	<ion-icon name='cart'></ion-icon> -->
							Cus.Due date : {{productdet.due_date}}
						</button>
					</ion-col>
			 </ion-row>
			 <ion-row no-padding *ngIf='productdet.ref_no!=null'>
				<ion-col float-left>
					<button ion-button clear small style="color:black !important" icon-start >
							Cus.Ref no : {{productdet.ref_no}}
					</button>
				</ion-col>
			</ion-row>
				<ion-row no-padding style="border-top:1px solid lightgrey">
					<ion-col col-9 style="margin-top:10px;color:black;font-weight: initial;
					margin-left: 11px;" float-left>
						<span>
							Remarks : {{productdet.description}}
						</span>
					</ion-col>
					<ion-col >
							<a target="blank"  href="https://api.whatsapp.com/send?text=image:{{productdet.customimages.length>0 ?productdet.customimages : productdet.image}}%0AOrder NO : {{productdet.orderno}}%0AItem : {{productdet.productname}}%0AWeight : {{productdet.weight}}g%0AQty : {{productdet.totalitems}}%0A Status : {{productdet.orderstatus}}%0ADelivery Date : {{productdet.delivery_date}}%0ADescription : {{productdet.description}}">
								<button ion-fab color="secondary" float-right>
									<ion-icon name="logo-whatsapp"></ion-icon>
								</button>
							</a>
					</ion-col>
			 </ion-row>
	</ion-card>

  <!-- Cancel Reasons Card -->
  <ion-card *ngIf="productdet.status == 0">
    <ion-card-header color="dark" text-center>
      <b>Select Reason for Cancellation</b>
    </ion-card-header>

    <ion-list radio-group [(ngModel)]="selectedReason">
      <ion-item *ngFor="let key of getResonKeys()">
        <ion-label [ngClass]="{'blue': key == '4'}">{{ resons[key] }}</ion-label>
        <ion-radio [value]="key"></ion-radio>
      </ion-item>
    </ion-list>

    <!-- Show textarea only if "Other" is selected -->
    <ion-item *ngIf="selectedReason == '4'">
      <ion-textarea [(ngModel)]="otherReasonText" placeholder="Enter reason..." rows="4"></ion-textarea>
    </ion-item>

    <ion-row padding>
   <!--    <ion-col col-6>
        <button ion-button color="danger" block (click)="selectedReason=''; otherReasonText=''">Cancel</button>
      </ion-col> -->
      <ion-col>
        <button ion-button full color="danger" [disabled]=" !selectedReason || (selectedReason === '4' && !otherReasonText.trim())" block (click)="confirmCancel()">Cancel Order </button>
      </ion-col>
    </ion-row>
  </ion-card>

  <!-- Show cancellation info if order is rejected (status 8) -->
<ion-card *ngIf="productdet.status == 8 || productdet.status == 6">
  <ion-card-header color="danger" text-center>
    <b>{{productdet.orderstatus}}</b>
  </ion-card-header>

  <ion-card-content>
    <ion-item *ngIf="productdet.reject_reason_type">
      <ion-label color="dark" style="font-size: 1.4rem !important; font-weight: 600 !important;">Reason Type:</ion-label>
      <ion-note item-end style="font-size: 1.4rem !important; font-weight: normal !important;color: #222 !important;">{{ productdet.reject_reason_type }}</ion-note>
    </ion-item>

    <ion-item *ngIf="productdet.reject_reason">
      <ion-label color="dark" style="font-size: 1.4rem !important; font-weight: 600 !important;">Reason:</ion-label>
    </ion-item>

    <div *ngIf="productdet.reject_reason" padding-left padding-right padding-bottom>
      <p style="font-size: 1.4rem !important; font-weight: normal !important;">{{ productdet.reject_reason }}</p>
    </div>
  </ion-card-content>
</ion-card>

</ion-content>
