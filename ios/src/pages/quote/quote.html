<ion-header>

  <ion-navbar>
    <ion-title>Quote Details</ion-title>
    <!-- <ion-buttons end>
        <button ion-button (click)="closeModal()">Close</button>
        </ion-buttons> -->
  </ion-navbar>

</ion-header>


<ion-content >
  <ion-card style="font-weight:bold;    padding: 8px;background: gold">
      <ion-badge>{{product.name}}</ion-badge>

      <ion-row [hidden]="product.prodefaultimg == null">
          <ion-col col-3>
          </ion-col>
        <ion-col col-6>
        <img style="height:150px;"  [src]='product.prodefaultimg' imageViewer="{{product.prodefaultimg}}" alt="image"/>
      </ion-col>
      <ion-col col-3>
  </ion-col>
    </ion-row>
<ion-row>
  <ion-col col-4>
    Item Name
  </ion-col>
  <ion-col col-1>:</ion-col>
  <ion-col col-7>
      {{product.name}}
    </ion-col>
</ion-row>
<ion-row>
  <ion-col col-4>
    Purity
  </ion-col>
  <ion-col col-1>:</ion-col>

  <ion-col col-7>
      {{purityname}}
    </ion-col>
</ion-row>
  
      <ion-row>
          <ion-col col-4>
            Weight
          </ion-col>
            <ion-col col-1>:</ion-col>

          <ion-col col-7>
              {{product.reqweight}} g
            </ion-col>
        </ion-row>
        <ion-row>
            <ion-col col-4>
            Size
            </ion-col>
            <ion-col col-1>:</ion-col>

            <ion-col col-7>
                {{product.sizeorlen}}
              </ion-col>
          </ion-row>
          <ion-row>
              <ion-col col-4>
              Tax
              </ion-col>
              <ion-col col-1>:</ion-col>

              <ion-col col-7>
                  {{product.tax}}
                </ion-col>
            </ion-row>
